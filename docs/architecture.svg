<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Minutes architecture</title>
<desc id="d">The browser uploads or records audio and posts it to a Vercel route that parses the audio length, checks limits and reserves the daily audio budget in Upstash Redis, then calls OpenAI diarized transcription. A second route turns the transcript into cited minutes with the OpenAI Responses API and verifies the citations.</desc>
